name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: identity
            file: docker/spring-service.Dockerfile
            context: .
            service: identity
          - name: edge-sidecar
            file: docker/spring-service.Dockerfile
            context: .
            service: edge-sidecar
          - name: broker
            file: docker/spring-service.Dockerfile
            context: .
            service: broker
          - name: echo
            file: docker/spring-service.Dockerfile
            context: .
            service: echo
          - name: control-plane
            file: docker/control-plane.Dockerfile
            context: .
            service: control-plane
          - name: patroni
            file: deploy/hetzner/patroni.Dockerfile
            context: deploy/hetzner
          - name: migrations
            file: db/Dockerfile
            context: db
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Image name
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/tri-edge-${NAME}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.service != ''
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: matrix.service != ''
      - name: Build the jar
        if: matrix.service != ''
        env:
          SERVICE: ${{ matrix.service }}
        run: ./gradlew ":services:${SERVICE}:bootJar"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.file == 'docker/spring-service.Dockerfile' && format('SERVICE={0}', matrix.service) || '' }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.SHA }}
          labels: org.opencontainers.image.revision=${{ env.SHA }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
