name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build

  migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: triedge
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: triedge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triedge -d triedge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/triedge
      FLYWAY_USER: triedge
      FLYWAY_PASSWORD: ci
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t triedge-migrations db
      - name: Apply migrations to an empty database
        run: docker run --rm --network host -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD triedge-migrations migrate
      - name: Apply again, must be a no-op
        run: docker run --rm --network host -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD triedge-migrations migrate
      - name: Check service grants
        run: psql -h localhost -U triedge -d triedge -f db/tests/grants_test.sql

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [java, migrations]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/dev.sh up
      - run: scripts/dev.sh app
      - run: pnpm --filter @tri-edge/e2e test
        env:
          CI: "true"
      - name: Service logs
        if: failure()
        run: docker compose --profile app logs --no-color --tail 200
