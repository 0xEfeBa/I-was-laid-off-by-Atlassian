name: tri-edge

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: triedge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev.sh up}
      POSTGRES_DB: triedge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triedge -d triedge"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.6.15
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10

  flyway:
    build: ./db
    profiles: ["tools"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/triedge
      FLYWAY_USER: triedge
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev.sh up}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./dev/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
    environment:
      DATA_SOURCE_URI: postgres:5432/triedge?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${MONITORING_DB_PASSWORD:?run scripts/dev.sh up}
    depends_on:
      postgres:
        condition: service_healthy

  alloy:
    image: grafana/alloy:v1.11.3
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    environment:
      REGION: eu
      LOKI_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  tempo:
    image: grafana/tempo:2.10.8
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.6.17
    ports:
      - "127.0.0.1:3100:3100"

  grafana:
    image: grafana/grafana:12.4.12
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./observability/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./observability/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
      - loki

  identity:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: identity
    environment:
      TRIEDGE_REGION: eu
      TRIEDGE_CLUSTERS_EU_URL: jdbc:postgresql://postgres:5432/triedge
      TRIEDGE_CLUSTERS_EU_USERNAME: identity_service
      TRIEDGE_CLUSTERS_EU_PASSWORD: ${IDENTITY_DB_PASSWORD:?run scripts/dev.sh up}
      TRIEDGE_IDENTITY_ETCD_URL: http://etcd:2379
      TRIEDGE_IDENTITY_ALLOW_EPHEMERAL_KEY: "true"
      TRIEDGE_IDENTITY_SECURE_COOKIES: "false"
      TRIEDGE_IDENTITY_ALLOWED_ORIGINS: http://localhost:5173
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy

  edge-sidecar:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: edge-sidecar
    environment:
      TRIEDGE_REGION: eu
      TRIEDGE_CLUSTERS_EU_URL: jdbc:postgresql://postgres:5432/triedge
      TRIEDGE_CLUSTERS_EU_USERNAME: edge_sidecar
      TRIEDGE_CLUSTERS_EU_PASSWORD: ${EDGE_SIDECAR_DB_PASSWORD:?run scripts/dev.sh up}
      TRIEDGE_SIDECAR_ISSUER: tri-edge
      TRIEDGE_SIDECAR_JWKS_URL: http://identity:8130/.well-known/jwks.json
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy

  k6:
    profiles: ["tools"]
    image: grafana/k6:1.3.0
    command: ["run", "/scripts/gateway.js"]
    environment:
      GATEWAY_URL: http://envoy:8080
      RATE: ${RATE:-200}
      DURATION: ${DURATION:-2m}
    volumes:
      - ./tests/load:/scripts:ro

  control-plane:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    environment:
      TRIEDGE_REGION: eu
      TRIEDGE_CLUSTERS_EU_URL: jdbc:postgresql://postgres:5432/triedge
      TRIEDGE_CLUSTERS_EU_USERNAME: control_plane
      TRIEDGE_CLUSTERS_EU_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run scripts/dev.sh up}
      TRIEDGE_CONTROL_PLANE_ETCD_URL: http://etcd:2379
      TRIEDGE_CONTROL_PLANE_SYSTEM_TENANTS_DIR: /etc/triedge/system-tenants
      TRIEDGE_CONTROL_PLANE_TRACING_COLLECTOR: tempo:4318
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9100/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 60s
    volumes:
      - ./deploy/system-tenants:/etc/triedge/system-tenants:ro
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy

  control-plane-2:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    environment:
      TRIEDGE_REGION: eu
      SERVER_PORT: 8101
      TRIEDGE_CONTROL_PLANE_XDS_PORT: 18001
      TRIEDGE_CLUSTERS_EU_URL: jdbc:postgresql://postgres:5432/triedge
      TRIEDGE_CLUSTERS_EU_USERNAME: control_plane
      TRIEDGE_CLUSTERS_EU_PASSWORD: ${CONTROL_PLANE_DB_PASSWORD:?run scripts/dev.sh up}
      TRIEDGE_CONTROL_PLANE_ETCD_URL: http://etcd:2379
      TRIEDGE_CONTROL_PLANE_SYSTEM_TENANTS_DIR: /etc/triedge/system-tenants
      TRIEDGE_CONTROL_PLANE_TRACING_COLLECTOR: tempo:4318
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/actuator/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 60s
    volumes:
      - ./deploy/system-tenants:/etc/triedge/system-tenants:ro
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy

  broker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: broker
    environment:
      TRIEDGE_REGION: eu
      TRIEDGE_CLUSTERS_EU_URL: jdbc:postgresql://postgres:5432/triedge
      TRIEDGE_CLUSTERS_EU_USERNAME: broker
      TRIEDGE_CLUSTERS_EU_PASSWORD: ${BROKER_DB_PASSWORD:?run scripts/dev.sh up}
      TRIEDGE_BROKER_ETCD_URL: http://etcd:2379
      TRIEDGE_BROKER_CONTROL_PLANE_URLS: http://control-plane:8100,http://control-plane-2:8101
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy

  echo:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/spring-service.Dockerfile
      args:
        SERVICE: echo
    environment:
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces

  envoy:
    profiles: ["app"]
    image: envoyproxy/envoy:v1.39.4
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./envoy/bootstrap.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - control-plane
      - control-plane-2
      - identity
      - edge-sidecar
      - broker
      - echo

volumes:
  postgres-data:
  etcd-data:
  tempo-data:
