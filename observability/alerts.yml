groups:
  - name: tri-edge
    rules:
      - alert: RegionUnreachable
        expr: up{job="envoy"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "The edge in {{ $labels.region }} does not answer"

      - alert: DatabaseWithoutLeader
        expr: max by (scope) (patroni_primary) == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Cluster {{ $labels.scope }} has no primary"

      - alert: EnvoyLostControlPlane
        expr: envoy_control_plane_connected_state == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "Envoy in {{ $labels.region }} is not connected to a control plane"

      - alert: HighErrorRate
        expr: |
          sum by (region) (rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix="public", envoy_response_code_class="5"}[1m]))
            / sum by (region) (rate(envoy_http_downstream_rq_total{envoy_http_conn_manager_prefix="public"}[1m])) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests in {{ $labels.region }} fail with 5xx"

      - alert: OutboxBehind
        expr: time() - triedge_outbox_last_read_seconds > 10
        for: 30s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} in {{ $labels.region }} has not read the {{ $labels.outbox }} outbox of {{ $labels.cluster }} for over 10 s"
