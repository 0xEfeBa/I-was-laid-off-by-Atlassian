node:
  id: envoy-eu-1
  cluster: edge

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

dynamic_resources:
  ads_config:
    api_type: DELTA_GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc: { cluster_name: xds }
  lds_config: { ads: {}, resource_api_version: V3 }
  cds_config: { ads: {}, resource_api_version: V3 }

static_resources:
  clusters:
    - name: xds
      type: STRICT_DNS
      connect_timeout: 1s
      close_connections_on_host_health_failure: true
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options:
              connection_keepalive: { interval: 10s, timeout: 5s }
      health_checks:
        - timeout: 1s
          interval: 2s
          no_traffic_interval: 2s
          no_traffic_healthy_interval: 2s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check: {}
      load_assignment:
        cluster_name: xds
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: control-plane, port_value: 18000 }
              - endpoint:
                  address:
                    socket_address: { address: control-plane-2, port_value: 18001 }
