global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["control-plane:9100", "control-plane-2:9101"]
        labels: { region: eu, service: control-plane }
      - targets: ["broker:9110"]
        labels: { region: eu, service: broker }
      - targets: ["edge-sidecar:9120"]
        labels: { region: eu, service: edge-sidecar }
      - targets: ["identity:9130"]
        labels: { region: eu, service: identity }
      - targets: ["echo:9180"]
        labels: { region: eu, service: echo }

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["envoy:9902"]
        labels: { region: eu }

  - job_name: etcd
    static_configs:
      - targets: ["etcd:2379"]
        labels: { region: eu }

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels: { region: eu, cluster: eu }
