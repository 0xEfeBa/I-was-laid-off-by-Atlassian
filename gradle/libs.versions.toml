[versions]
java = "21"
spring-boot = "4.1.2"
junit = "6.1.3"
nimbus-jose-jwt = "10.10"
bouncycastle = "1.86"
envoy-api = "1.0.55"
json-schema-validator = "3.0.8"

[libraries]
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
envoy-api = { module = "io.envoyproxy.controlplane:api", version.ref = "envoy-api" }
envoy-control-plane-server = { module = "io.envoyproxy.controlplane:server", version.ref = "envoy-api" }
envoy-control-plane-cache = { module = "io.envoyproxy.controlplane:cache", version.ref = "envoy-api" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
