global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["10.66.0.1:9100", "10.66.0.1:9101"]
        labels: { region: eu, service: control-plane }
      - targets: ["10.66.0.1:9110"]
        labels: { region: eu, service: broker }
      - targets: ["10.66.0.1:9120"]
        labels: { region: eu, service: edge-sidecar }
      - targets: ["10.66.0.1:9130"]
        labels: { region: eu, service: identity }
      - targets: ["10.66.0.1:9180"]
        labels: { region: eu, service: echo }
      - targets: ["10.66.0.2:9100", "10.66.0.2:9101"]
        labels: { region: us, service: control-plane }
      - targets: ["10.66.0.2:9110"]
        labels: { region: us, service: broker }
      - targets: ["10.66.0.2:9120"]
        labels: { region: us, service: edge-sidecar }
      - targets: ["10.66.0.2:9130"]
        labels: { region: us, service: identity }
      - targets: ["10.66.0.2:9180"]
        labels: { region: us, service: echo }
      - targets: ["10.66.0.3:9100", "10.66.0.3:9101"]
        labels: { region: ap, service: control-plane }
      - targets: ["10.66.0.3:9110"]
        labels: { region: ap, service: broker }
      - targets: ["10.66.0.3:9120"]
        labels: { region: ap, service: edge-sidecar }
      - targets: ["10.66.0.3:9130"]
        labels: { region: ap, service: identity }
      - targets: ["10.66.0.3:9180"]
        labels: { region: ap, service: echo }

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs:
      - targets: ["10.66.0.1:9902"]
        labels: { region: eu }
      - targets: ["10.66.0.2:9902"]
        labels: { region: us }
      - targets: ["10.66.0.3:9902"]
        labels: { region: ap }

  - job_name: etcd
    static_configs:
      - targets: ["10.66.0.1:2379"]
        labels: { region: eu }
      - targets: ["10.66.0.2:2379"]
        labels: { region: us }
      - targets: ["10.66.0.3:2379"]
        labels: { region: ap }

  - job_name: patroni
    static_configs:
      - targets: ["10.66.0.1:8008", "10.66.0.1:8009", "10.66.0.1:8010"]
        labels: { region: eu }
      - targets: ["10.66.0.2:8008", "10.66.0.2:8009", "10.66.0.2:8010"]
        labels: { region: us }
      - targets: ["10.66.0.3:8008", "10.66.0.3:8009", "10.66.0.3:8010"]
        labels: { region: ap }

  - job_name: postgres
    static_configs:
      - targets: ["10.66.0.1:9187"]
        labels: { region: eu, cluster: eu }
      - targets: ["10.66.0.1:9188"]
        labels: { region: eu, cluster: us }
      - targets: ["10.66.0.1:9189"]
        labels: { region: eu, cluster: ap }
      - targets: ["10.66.0.2:9187"]
        labels: { region: us, cluster: eu }
      - targets: ["10.66.0.2:9188"]
        labels: { region: us, cluster: us }
      - targets: ["10.66.0.2:9189"]
        labels: { region: us, cluster: ap }
      - targets: ["10.66.0.3:9187"]
        labels: { region: ap, cluster: eu }
      - targets: ["10.66.0.3:9188"]
        labels: { region: ap, cluster: us }
      - targets: ["10.66.0.3:9189"]
        labels: { region: ap, cluster: ap }
